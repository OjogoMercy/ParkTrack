# Required status check "ci" (see docs/WORKFLOW.md §3).
# Runs on every PR into main or a scope branch, and on pushes to them.
name: ci

on:
  pull_request:
    branches: [main, "scope/**"]
  push:
    branches: [main, "scope/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Format
        run: npm run format:check

      - name: Build
        run: npm run build
